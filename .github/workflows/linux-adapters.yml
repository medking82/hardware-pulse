name: Linux adapter

on:
  push:
    branches: [main]
    paths:
      - 'src/Core/**'
      - 'src/Adapters/Linux/**'
      - 'scripts/LinuxAdapterTests/**'
      - 'src/Hosts/LinuxProbe/**'
      - 'src/Hosts/Common/**'
      - 'scripts/test_linux_probe.py'
      - '.github/workflows/linux-adapters.yml'
  pull_request:
    paths:
      - 'src/Core/**'
      - 'src/Adapters/Linux/**'
      - 'scripts/LinuxAdapterTests/**'
      - 'src/Hosts/LinuxProbe/**'
      - 'src/Hosts/Common/**'
      - 'scripts/test_linux_probe.py'
      - '.github/workflows/linux-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-adapter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux adapter / ${{ matrix.runner }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: X64
          - runner: ubuntu-24.04-arm
            arch: Arm64
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PULSE_TEST_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Record SDK and runtime
        run: dotnet --info
      - name: Run fixtures and live procfs assertions
        env:
          DOTNET_TieredCompilation: '0'
        run: dotnet run --project scripts/LinuxAdapterTests/Pulse.Linux.Tests.csproj --configuration Release --disable-build-servers -p:UseSharedCompilation=false -- --live --measure
      - name: Build headless probe
        run: dotnet build src/Hosts/LinuxProbe/Pulse.Linux.Probe.csproj --configuration Release --disable-build-servers -p:UseSharedCompilation=false
      - name: Test headless probe process contracts
        run: python3 scripts/test_linux_probe.py dotnet src/Hosts/LinuxProbe/bin/Release/net10.0/Pulse.Linux.Probe.dll
