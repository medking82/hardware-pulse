name: Desktop preview

on:
  push:
    branches: [main]
    paths: ['src/Hosts/Desktop/**', 'src/Core/**', 'src/Adapters/**', 'scripts/DesktopTests/**', 'scripts/package_desktop.py', 'scripts/prepare_desktop_fonts.py', 'scripts/desktop-fonts.lock.json', 'scripts/test_desktop_package.py', 'licenses/**', 'docs/distribution/**', 'assets/*.svg', '.github/workflows/desktop-preview.yml']
  pull_request:
    paths: ['src/Hosts/Desktop/**', 'src/Core/**', 'src/Adapters/**', 'scripts/DesktopTests/**', 'scripts/package_desktop.py', 'scripts/prepare_desktop_fonts.py', 'scripts/desktop-fonts.lock.json', 'scripts/test_desktop_package.py', 'licenses/**', 'docs/distribution/**', 'assets/*.svg', '.github/workflows/desktop-preview.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: X64
            rid: win-x64
          - runner: windows-11-arm
            arch: Arm64
            rid: win-arm64
          - runner: ubuntu-24.04
            arch: X64
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            arch: Arm64
            rid: linux-arm64
          - runner: macos-15-intel
            arch: X64
            rid: osx-x64
          - runner: macos-15
            arch: Arm64
            rid: osx-arm64
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PULSE_TEST_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.401'
      - name: Prepare pinned embedded fonts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Run-Hidden.ps1 (Get-Command python).Source @('scripts/prepare_desktop_fonts.py') $PWD.Path
      - name: Prepare pinned embedded fonts (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/prepare_desktop_fonts.py
      - name: Restore pinned dependencies
        run: dotnet restore scripts/DesktopTests/Pulse.Desktop.Tests.csproj --locked-mode
      - name: Render, layout, keyboard and shutdown contracts
        run: dotnet run --project scripts/DesktopTests/Pulse.Desktop.Tests.csproj -c Release --no-restore --disable-build-servers -p:UseSharedCompilation=false
      - name: Native Windows demo window measurement
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/Run-Hidden.ps1 (Get-Command dotnet).Source @('scripts/DesktopTests/bin/Release/net10.0/Pulse.Desktop.Tests.dll','--native-session') $PWD.Path
          ./scripts/Run-Hidden.ps1 (Get-Command dotnet).Source @('src/Hosts/Desktop/bin/Release/net10.0/Pulse.Desktop.dll','--smoke-test') $PWD.Path
          ./scripts/Run-Hidden.ps1 (Get-Command dotnet).Source @('src/Hosts/Desktop/bin/Release/net10.0/Pulse.Desktop.dll','--demo','--measure-session') $PWD.Path
      - name: Native Linux window with live telemetry
        if: runner.os == 'Linux'
        run: |
          timeout 60s xvfb-run -a dotnet scripts/DesktopTests/bin/Release/net10.0/Pulse.Desktop.Tests.dll --native-session
          timeout 30s xvfb-run -a dotnet src/Hosts/Desktop/bin/Release/net10.0/Pulse.Desktop.dll --smoke-test
      - name: Native macOS window with live telemetry
        if: runner.os == 'macOS'
        run: |
          dotnet scripts/DesktopTests/bin/Release/net10.0/Pulse.Desktop.Tests.dll --native-session
          dotnet src/Hosts/Desktop/bin/Release/net10.0/Pulse.Desktop.dll --smoke-test
      - name: Linux GC attribution with transient and retained framebuffer
        if: runner.os == 'Linux'
        run: |
          timeout 120s xvfb-run -a dotnet src/Hosts/Desktop/bin/Release/net10.0/Pulse.Desktop.dll --measure-session --diagnose-gc --transient-framebuffer
          timeout 120s xvfb-run -a dotnet src/Hosts/Desktop/bin/Release/net10.0/Pulse.Desktop.dll --measure-session --diagnose-gc
      - name: Package and launch extracted Linux AppHost
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/package_desktop.py --rid ${{ matrix.rid }} --measure-session
      - name: Reject damaged or incomplete packages
        if: runner.os != 'Windows'
        run: python3 scripts/test_desktop_package.py
      - name: Package and launch extracted Windows AppHost
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/Run-Hidden.ps1 (Get-Command python).Source @('scripts/test_desktop_package.py') $PWD.Path
          ./scripts/Run-Hidden.ps1 (Get-Command python).Source @('scripts/package_desktop.py','--rid','${{ matrix.rid }}','--smoke-test') $PWD.Path
      - name: Package and launch extracted macOS AppHost
        if: runner.os == 'macOS'
        run: python3 scripts/package_desktop.py --rid ${{ matrix.rid }} --measure-session
      - name: Retain verified development packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-preview-${{ matrix.rid }}
          path: dist/desktop-preview/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
