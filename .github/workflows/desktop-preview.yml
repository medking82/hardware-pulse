name: Desktop preview

on:
  push:
    branches: [main]
    paths: ['src/Hosts/Desktop/**', 'src/Core/**', 'src/Adapters/**', 'scripts/DesktopTests/**', 'assets/*.svg', '.github/workflows/desktop-preview.yml']
  pull_request:
    paths: ['src/Hosts/Desktop/**', 'src/Core/**', 'src/Adapters/**', 'scripts/DesktopTests/**', 'assets/*.svg', '.github/workflows/desktop-preview.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: X64
          - runner: windows-11-arm
            arch: Arm64
          - runner: ubuntu-24.04
            arch: X64
          - runner: ubuntu-24.04-arm
            arch: Arm64
          - runner: macos-15-intel
            arch: X64
          - runner: macos-15
            arch: Arm64
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PULSE_TEST_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.401'
      - name: Restore pinned dependencies
        run: dotnet restore scripts/DesktopTests/Pulse.Desktop.Tests.csproj --locked-mode
      - name: Render, layout, keyboard and shutdown contracts
        run: dotnet run --project scripts/DesktopTests/Pulse.Desktop.Tests.csproj -c Release --no-restore --disable-build-servers -p:UseSharedCompilation=false
      - name: Native Windows window with demo data
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Run-Hidden.ps1 (Get-Command dotnet).Source @('src/Hosts/Desktop/bin/Release/net10.0/Pulse.Desktop.dll','--demo','--smoke-test') $PWD.Path
      - name: Native Linux window with live telemetry
        if: runner.os == 'Linux'
        run: timeout 30s xvfb-run -a dotnet src/Hosts/Desktop/bin/Release/net10.0/Pulse.Desktop.dll --smoke-test
      - name: Native macOS window with live telemetry
        if: runner.os == 'macOS'
        run: dotnet src/Hosts/Desktop/bin/Release/net10.0/Pulse.Desktop.dll --smoke-test
